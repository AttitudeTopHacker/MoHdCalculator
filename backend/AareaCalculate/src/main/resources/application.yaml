spring:
  application:
    name: AreaCalculator

  # ── PostgreSQL / Supabase ────────────────────────────────────────────────
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update          # creates/updates tables on startup
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Spring Mail (Gmail SMTP) ─────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Google OAuth2 ────────────────────────────────────────────────────────
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "${OAUTH2_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}"

# ── JWT ──────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# ── App Config ────────────────────────────────────────────────────────────────
app:
  frontend-url: ${FRONTEND_URL:http://localhost:4151}
  admin-emails: ${ADMIN_EMAILS:mohdsalman4151@gmail.com}

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    org.springframework.security: DEBUG

# ── Resend Email API ──────────────────────────────────────────────────────────
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM_EMAIL:AreaCalculator <onboarding@resend.dev>}

# ── Gmail API (HTTP REST API) ────────────────────────────────────────────────
gmail:
  client-id: ${GMAIL_CLIENT_ID:}
  client-secret: ${GMAIL_CLIENT_SECRET:}
  refresh-token: ${GMAIL_REFRESH_TOKEN:}
